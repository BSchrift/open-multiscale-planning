# Settings for local, complete: no file in env/ inherits from another, and all three have the same keys. They're
# public and the same for every deployment. What only one deployment has, such as its account or domain, stays in
# the private config folder, and secrets stay in SSM. See docs/config.md.
#
# Retention, when it's set here, never lets the server purge what an older app could still push back. To shorten it,
# shorten it over two releases, the server's last.

stack:
  # Whether CloudFormation refuses to delete the stack.
  # Local runs no stack, so nothing reads this one there.
  terminationProtection: false
  # How a new backend version takes traffic: this share of invocations first, for this many minutes, then all of it.
  # Local runs no stack, so nothing reads these there either.
  canaryPercent: 5
  canaryMinutes: 10
  # Whether DynamoDB throttling the API's requests stops a release and rolls it back.
  # Local runs no stack, so nothing reads this there either.
  throttleReleaseAlarm: false
