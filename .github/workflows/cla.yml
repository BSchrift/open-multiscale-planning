name: CLA
on:
  issue_comment:
    types: [created]
  # Runs the base branch's workflow with a write token; it never checks out pull request code, so keep it that way.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/BSchrift/open-multiscale-planning/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          # Signatures live on their own unprotected branch, so main can stay protected.
          branch: cla-signatures
          allowlist: BSchrift,*[bot]
