name: CI
on:
  # A branch's pushes run once, through its pull request.
  push:
    branches: [main]
  pull_request:
  # Every night on main, for the iPhone's full suite: see the changes job.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels its checks still running for the push before, so they don't hold macOS runners.
# Each push to main gets a group of its own, so none is cancelled or left waiting behind another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Native and binary downloads are only needed by the Electron and iOS builds.
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            config/go.sum
      - run: make test-backend

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci
        working-directory: infrastructure
      - run: make test-infra

  # The whole local suite with its Docker stand-ins. It needs no secrets, so it also runs on forks.
  local-suite:
    runs-on: ubuntu-latest
    needs: [frontend, backend, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            config/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: make test-integration

  # The rest of make test-e2e, a part per job so they run side by side. The screens in desktop Chromium and phone WebKit.
  e2e-browser:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # Browser builds are made per OS release, and ubuntu-latest moves between releases, so the release is in the key.
      - id: playwright
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >>"$GITHUB_OUTPUT"
          . /etc/os-release && echo "os=$ID-$VERSION_ID" >>"$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # The system libraries aren't cached, so this runs either way. It skips browsers already there.
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: scripts/e2e.sh browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-browser
          path: |
            frontend/playwright-report
            frontend/test-results

  # Two signed-in browsers syncing through the local stack.
  e2e-stack:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            config/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - id: playwright
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >>"$GITHUB_OUTPUT"
          . /etc/os-release && echo "os=$ID-$VERSION_ID" >>"$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/e2e.sh stack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-stack
          path: |
            frontend/playwright-report
            frontend/test-results

  # The web bundle at main and at this commit: one device's database opened by each in turn, and the two as devices
  # syncing through the local stack. The full history, so main is there to build.
  e2e-compat:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            config/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >>"$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/e2e.sh compat
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-compat
          path: |
            frontend/playwright-report
            frontend/test-results

  # The core database tests under Electron's runtime, then the real app, two instances of it syncing through the local
  # stack. On Linux, which the stack's Docker needs, with a virtual display. better-sqlite3 ships prebuilt.
  e2e-electron:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            config/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # Electron's binary comes from GitHub's release downloads, which time out now and then. So it's cached by version,
      # and fetched before the tests with retries, rather than on first launch. The cache is saved as soon as it's
      # filled, so a run whose tests fail still keeps it.
      - id: electron-version
        run: echo "version=$(node -p "require('electron/package.json').version")" >>"$GITHUB_OUTPUT"
        working-directory: frontend
      - id: electron
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron-version.outputs.version }}
      - name: Download Electron
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: frontend
      - if: steps.electron.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron.outputs.cache-primary-key }}
      - run: xvfb-run -a scripts/e2e.sh electron
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-electron
          path: |
            frontend/playwright-report
            frontend/test-results

  # Which iPhone suite to run, since a run holds one of the few macOS runners for its whole length. A pull request that
  # changes nothing the iPhone builds or draws runs none; one that does runs the smoke set, and one that changes the
  # iPhone's tests or their test page runs every test. Main and the nightly run run every test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.ios.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's checkout is the merge of the branch into its base, whose first parent is the base.
          fetch-depth: 2
      - id: ios
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "suite=full" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          tests='^(frontend/ios/App/UITests/|frontend/src/platform/capacitor-checks\.ts$|frontend/ios/harness/|scripts/test-ios\.sh$)'
          # The web app the iPhone shows, its build, its native project, its config, and how CI runs it.
          app='^(frontend/(src|ios|public)/|frontend/(index\.html|package(-lock)?\.json|vite\.config\.ts|capacitor\.config\.(ts|json)|tsconfig\.json)$|frontend/scripts/(ios-sync\.mjs|build-lock\.sh|test-target\.mjs)$|config/|scripts/local-stack\.sh$|Makefile$|\.github/workflows/ci\.yml$)'
          if grep -qE "$tests" <<<"$changed"; then suite=full
          elif grep -qE "$app" <<<"$changed"; then suite=smoke
          else suite=none
          fi
          echo "The iPhone job runs: $suite"
          echo "suite=$suite" >>"$GITHUB_OUTPUT"

  # The real app on an iPhone Simulator. The full suite runs every test with the extensions off, then the native checks
  # with them on; the smoke set runs the native checks and a test of each main flow, with them on (scripts/test-ios.sh).
  ios:
    runs-on: macos-15
    needs: [frontend, changes]
    if: needs.changes.outputs.ios != 'none'
    # The full suite takes about 80 minutes and the smoke set about 25, plus up to 11 when a test on the real clock reaches
    # its seed in the last ten minutes of a day (UTC), which it waits out.
    timeout-minutes: ${{ needs.changes.outputs.ios == 'full' && 120 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # Capacitor's and SQLCipher's frameworks come from GitHub's release downloads, which fail now and then. So the
      # Swift packages are cached by Package.resolved, and resolved before the build with retries, into the
      # DerivedData the build uses. The cache is saved as soon as it's filled, so a run whose tests fail still keeps it.
      - id: spm
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            frontend/ios/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('frontend/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath ios/DerivedData && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: frontend
      - if: steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            frontend/ios/DerivedData/SourcePackages
          key: ${{ steps.spm.outputs.cache-primary-key }}
      - run: make test-ios
        env:
          IOS_RESULTS: ${{ runner.temp }}/ios-results
          MULTISCALE_SUITE: ${{ needs.changes.outputs.ios }}
      # Kept even when the job passes, since a test marked as an expected failure passes the job with its screenshots. The
      # job's summary lists them.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: ${{ runner.temp }}/ios-results
          retention-days: 7
          if-no-files-found: ignore

  # The workflows themselves, with shellcheck on their scripts.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner
