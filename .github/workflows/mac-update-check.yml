# The staging update check (scripts/mac-update-check.sh, docs/releasing.md): on one of GitHub's Macs, with no signing
# secrets, the staging app passed before updates itself to the app staging's desktop feed names, quits so Squirrel
# installs it, and opens again as that app. A pass goes to the pipeline's inbox as inbox/update-check/<app version>.json,
# which prod's release waits for before it takes a new Mac app. It runs every half hour, so it follows staging soon after
# a release publishes a new app, and does nothing when the app passed already; and by hand.

name: Mac update check

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: mac-update-check
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    # The environment whose role may write to the inbox. No signing secret is read here.
    environment: release
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      # To read which app the last passing run passed, from its artifact.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
      # From the lockfile, running no package's install script, for mac-inbox.ts. Not cached.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend

      # Staging's release and downloads hosts, from the build config the Mac release reads, kept out of the log.
      - name: Read staging's hosts
        env:
          MAC_BUILD_CONFIG: ${{ secrets.MAC_BUILD_CONFIG }}
        run: |
          [ -n "$MAC_BUILD_CONFIG" ] || { echo "::error::The release environment lacks MAC_BUILD_CONFIG. See docs/releasing.md."; exit 1; }
          node frontend/scripts/mac-inbox.ts unpack-config "$RUNNER_TEMP/config"
          node -e 'const o = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(`RELEASE_URL=${o.ReleaseUrl}\nDOWNLOADS_URL=${o.DownloadsUrl}`)' "$RUNNER_TEMP/config/staging.outputs.json" >>"$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/config"

      # The app the last passing run passed, which this run updates from. Only this workflow, on main in the release
      # environment, writes that artifact.
      - name: Find the app passed before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=""
          for id in $(gh run list --workflow mac-update-check.yml --branch main --status success --limit 20 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -n update-check -D "$RUNNER_TEMP/previous" 2>/dev/null; then
              previous="$(cat "$RUNNER_TEMP/previous/passed.txt")"
              break
            fi
          done
          echo "PREVIOUS=$previous" >>"$GITHUB_ENV"
          echo "The app passed before: ${previous:-none}."

      - name: Check the update
        run: OUT="$RUNNER_TEMP/out" scripts/mac-update-check.sh

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_INBOX_ROLE_ARN || vars.AWS_INBOX_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Record the pass in the inbox
        id: record
        env:
          BUCKET: ${{ vars.AWS_INBOX_BUCKET }}
        run: |
          [ -f "$RUNNER_TEMP/out/pass.json" ] || { echo "Nothing new to record."; exit 0; }
          version="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version)' "$RUNNER_TEMP/out/pass.json")"
          aws s3 cp "$RUNNER_TEMP/out/pass.json" "s3://$BUCKET/inbox/update-check/$version.json" --content-type application/json --no-progress
          echo "$version" >"$RUNNER_TEMP/out/passed.txt"
          echo "passed=true" >>"$GITHUB_OUTPUT"
          echo "Recorded app $version's pass for prod's release."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.record.outputs.passed == 'true'
        with:
          name: update-check
          path: ${{ runner.temp }}/out/passed.txt
          retention-days: 90
