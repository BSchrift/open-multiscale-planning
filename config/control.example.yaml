# The control account: owns the domain and delegates a subzone to each environment.
# Copy to control.yaml in your config folder ($MULTISCALE_CONFIG_DIR, or this folder) and fill it in.
# Without a domain, delete the dns section here and in staging.yaml and prod.yaml: nothing is deployed here then, and
# staging and prod skip DNS.
aws:
  account: "333333333333"
  region: us-west-2
  profile: multiscale-control
dns:
  domain: example.com
  # The zone Route 53 made when you registered the domain: Route 53 > Hosted zones, or
  # aws route53 list-hosted-zones-by-name --dns-name <domain> --profile <profile>
  hostedZoneId: Z0123456789EXAMPLE
  # Optional: TXT values on the domain itself, such as the one Google Search Console gives to prove you own it.
  # txt:
  #   - google-site-verification=...
# Optional: the release pipeline, which runs in this account and deploys staging and prod (docs/releasing.md). Deploy
# it with make deploy ENV=pipeline. Without this section there is no pipeline, and releases run from make as before.
pipeline:
  # The GitHub repository and branch it releases, through a connection you authorise once in the console.
  repository: your-github-user/open-multiscale-planning
  branch: main
  # Where the notice that a release is going to prod, and failed runs, are emailed.
  email: you@example.com
  # How long after staging passes a release goes to prod, unless you stop it with make pipeline-stop: an ISO 8601
  # duration, PT2H if left out, or PT0S to go at once. Prod's canary still guards it.
  promoteAfter: PT2H
  # How long prod's web app bakes before the Mac gets the release, and the Mac's before the iPhone gets it, in the same
  # format: PT2H if left out, PT0S for no bake. Each bake ends with a check that no release alarm is in ALARM.
  bakeWeb: PT2H
  bakeDesktop: PT2H
  # Optional: Mac apps built, signed and notarized by GitHub Actions for each commit that needs a new one, which the
  # pipeline checks and publishes (docs/releasing.md). Without it, such a commit leaves the feed as it is, for a release
  # from the Mac.
  # mac:
  #   # The team id your Developer ID certificate names: Developer ID Application: <name> (<team id>).
  #   teamId: ABCDE12345
  #   # How long a run waits for GitHub Actions' build, which waits for your approval: PT2H if left out, up to PT7H.
  #   waitFor: PT2H
  #   # existing if the account already has GitHub's OIDC provider, token.actions.githubusercontent.com.
  #   githubOidcProvider: create
  #   # The subject of GitHub's tokens for the release environment, if GitHub gives this repository immutable subjects:
  #   # gh api repos/<owner>/<repo>/actions/oidc/customization/sub shows its sub_claim_prefix, and this is that prefix
  #   # followed by :environment:release. Left out, repo:<repository>:environment:release.
  #   githubSubject: repo:your-github-user@12345/open-multiscale-planning@67890:environment:release
