# Settings for staging, complete: no file in env/ inherits from another, and all three have the same keys. They're
# public and the same for every deployment. What only one deployment has, such as its account or domain, stays in
# the private config folder, and secrets stay in SSM. See docs/config.md.
#
# Retention, when it's set here, never lets the server purge what an older app could still push back. To shorten it,
# shorten it over two releases, the server's last.

stack:
  # Whether CloudFormation refuses to delete the stack.
  terminationProtection: false
  # How a new backend version takes traffic: this share of invocations first, for this many minutes, then all of it.
  # A release alarm in that time moves the traffic back. Prod's is a day; staging's is short, so a release is quick
  # to test.
  canaryPercent: 5
  canaryMinutes: 10
  # Whether DynamoDB throttling the API's requests stops a release and rolls it back. Off here: staging's test load,
  # such as the history seed and the integration suite's largest pushes, goes through the API and can throttle at any
  # time, so a throttle is no sign of a bad release. It still emails.
  throttleReleaseAlarm: false

attachments:
  # What one person may store, unless make storage-quota raised theirs in meta#quota: 20 MiB, so the
  # suites can reach it.
  defaultQuotaBytes: 20971520
  # Uploads one person may be granted in an hour.
  uploadsPerHour: 60
  # What one person may download in an hour, counted as the API hands out links: 1 GiB.
  downloadBytesPerHour: 1073741824
